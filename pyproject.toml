[project]
name = "musaeus"
version = "0.1.0"
description = "An open, local-first LLM agent you actually own — a teaching codebase for modern LLM systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MUSE" }]
keywords = ["llm", "agent", "rag", "tool-use", "local-llm", "ollama"]

# Deliberately small. Musaeus reimplements concepts rather than importing a mega-framework.
dependencies = [
    "httpx>=0.27",         # one HTTP client for every provider (OpenAI-compatible + native)
    "pydantic>=2.7",       # structured output your code can trust
    "typer>=0.12",         # the CLI
    "rich>=13.7",          # readable terminal output / streaming
]

[project.optional-dependencies]
cloud = ["anthropic>=0.40", "openai>=1.40"]   # native SDKs (optional; httpx path works without them)
rag = ["numpy>=1.26"]                          # embeddings math for the local vector store
server = ["fastapi>=0.110", "uvicorn>=0.29"]   # serve it as an API
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
musaeus = "musaeus.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musaeus"]

[tool.ruff]
line-length = 100
